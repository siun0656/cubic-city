<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a5a">
<title>CUBIC CITY</title>
<style>
  :root { --navy:#1f2a5a; --ink:#1d2433; --sub:#5b6478; --line:#e6e9f0; --bg:#eef2fb;
          --story:#f08a24; --lab:#2f6ff0; --wb:#18a058; --mm:#e04545; --ok:#0a7f3f; --bad:#c62828; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; color:var(--ink); background:var(--bg); font-size:20px; user-select:none; }
  .hidden { display:none !important; }
  button { font-family:inherit; cursor:pointer; border:0; }

  /* 상단 바 */
  .bar { height:60px; display:flex; align-items:center; gap:14px; padding:0 24px; background:var(--navy); color:#fff; }
  .bar .logo { font-weight:800; letter-spacing:1px; font-size:22px; }
  .bar .grow { flex:1; } .bar .me { font-size:18px; opacity:.9; }
  .bar button { background:rgba(255,255,255,.15); color:#fff; padding:8px 14px; border-radius:10px; font-size:16px; min-height:44px; }

  /* 로그인 */
  #vLogin { height:100%; display:grid; grid-template-columns: 1fr 1fr; }
  .hero { background:linear-gradient(160deg,#1f2a5a,#3651c9); color:#fff; display:flex; flex-direction:column; justify-content:center; padding:48px; }
  .hero h1 { font-size:52px; margin:0 0 8px; letter-spacing:2px; } .hero p { font-size:20px; opacity:.85; margin:0; }
  .cubes { margin-top:36px; font-size:64px; letter-spacing:12px; }
  .panel { display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; }
  .panel h2 { margin:0 0 6px; font-size:26px; } .panel .hint { color:var(--sub); font-size:17px; margin:0 0 18px; text-align:center; }
  .nums { display:grid; grid-template-columns:repeat(7, 64px); gap:10px; justify-content:center; }
  .nums button { height:56px; border-radius:14px; background:#fff; font-size:22px; font-weight:700; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .nums button:active { transform:scale(.96); }
  .pinBox { display:flex; gap:14px; margin:6px 0 18px; }
  .pinBox span { width:52px; height:60px; border-radius:14px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:inset 0 0 0 2px var(--line); }
  .pinBox span.f { box-shadow:inset 0 0 0 3px #3651c9; }
  .pad { display:grid; grid-template-columns:repeat(3, 88px); gap:10px; }
  .pad button { height:64px; border-radius:16px; background:#fff; font-size:28px; font-weight:700; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .pad button.sub { font-size:18px; color:var(--sub); }
  .back { margin-top:16px; background:none; color:var(--sub); font-size:17px; text-decoration:underline; min-height:44px; }
  .err { color:var(--bad); font-weight:700; min-height:28px; margin-top:12px; text-align:center; font-size:18px; }
  .bigNo { font-size:46px; font-weight:800; margin:0; }

  /* 홈 */
  #vHome { min-height:100%; }
  .homeWrap { padding:24px 32px; max-width:1280px; margin:0 auto; }
  .hello { font-size:26px; font-weight:800; margin:4px 0 16px; }
  .today { background:#fff; border-radius:20px; padding:20px 24px; box-shadow:0 2px 6px rgba(0,0,0,.06); margin-bottom:22px; }
  .today h3 { margin:0 0 6px; font-size:20px; color:var(--sub); font-weight:600; }
  .today .t { font-size:24px; font-weight:800; } .today .s { color:var(--sub); font-size:17px; margin-top:4px; }
  .menus { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; }
  .menu { border-radius:22px; padding:22px; min-height:210px; color:#fff; text-align:left; display:flex; flex-direction:column; justify-content:space-between; position:relative; box-shadow:0 4px 10px rgba(0,0,0,.12); }
  .menu .ic { font-size:44px; } .menu .nm { font-size:22px; font-weight:800; letter-spacing:.5px; } .menu .ds { font-size:16px; opacity:.92; margin-top:4px; }
  .menu .soon { position:absolute; top:14px; right:14px; background:rgba(255,255,255,.25); padding:4px 10px; border-radius:99px; font-size:14px; }
  .m1 { background:var(--story); } .m2 { background:var(--lab); } .m3 { background:var(--wb); } .m4 { background:var(--mm); }
  .menu[disabled] { filter:saturate(.75); }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#1d2433; color:#fff; padding:12px 22px; border-radius:14px; font-size:18px; opacity:0; transition:.25s; pointer-events:none; }
  .toast.on { opacity:.95; }
  .notice { max-width:640px; margin:14vh auto; background:#fff; border-radius:20px; padding:32px; text-align:center; }
  .notice button { margin-top:18px; background:#3651c9; color:#fff; padding:12px 22px; border-radius:12px; font-size:18px; }
  @media (max-width: 1100px) { .nums { grid-template-columns:repeat(6, 60px); } .hero h1 { font-size:42px; } .menus { gap:12px; } }
  .bar .homeBtn { background:rgba(255,255,255,.22); }
  .crumb { font-size:18px; color:var(--sub); margin:0 0 14px; display:flex; gap:10px; align-items:center; }
  .crumb button { background:#fff; border-radius:12px; padding:8px 14px; font-size:17px; min-height:44px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .sec { font-size:20px; font-weight:800; margin:18px 0 10px; }
  .qgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  .qcard { background:#fff; border-radius:18px; padding:18px 20px; text-align:left; box-shadow:0 2px 6px rgba(0,0,0,.06); min-height:118px; display:flex; flex-direction:column; gap:8px; font-size:18px; color:var(--ink); }
  .qcard .tt { font-weight:800; font-size:22px; } .qcard .dd { color:var(--sub); font-size:16px; line-height:1.4; }
  .badge { align-self:flex-start; display:inline-block; padding:5px 12px; border-radius:99px; font-size:15px; font-weight:800; }
  .b-new { background:#eef1f8; color:var(--sub); } .b-ok { background:#e5f6ec; color:var(--ok); } .b-bad { background:#fde8e8; color:var(--bad); } .b-wait { background:#fff4d6; color:#8a5a00; }
  .split { display:grid; grid-template-columns:55% 1fr; gap:18px; align-items:start; }
  .pc { background:#fff; border-radius:18px; padding:20px 22px; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .qtext { font-size:22px; line-height:1.55; margin:0; } .qimg { max-width:100%; border-radius:12px; margin-top:14px; border:1px solid var(--line); background:#fff; }
  .alt { color:var(--sub); font-size:17px; margin-top:10px; }
  .part { margin-bottom:20px; } .part .pp { font-size:19px; font-weight:700; margin-bottom:8px; line-height:1.45; }
  input.tx, textarea.tx { font-family:inherit; font-size:22px; padding:10px 14px; border-radius:12px; border:2px solid var(--line); width:100%; user-select:text; }
  textarea.tx { font-size:19px; min-height:96px; resize:vertical; }
  input.tx:focus, textarea.tx:focus { outline:none; border-color:#2f6ff0; }
  .unit { font-size:22px; margin-left:8px; } .numrow { display:flex; align-items:center; } .numrow input { width:180px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:10px 16px; border-radius:12px; background:#eef1f8; font-size:19px; min-height:50px; color:var(--ink); }
  .chip.on { background:#2f6ff0; color:#fff; }
  .face { display:flex; gap:8px; align-items:center; font-size:22px; }
  .face .bx { width:50px; height:54px; border-radius:12px; background:#fff; box-shadow:inset 0 0 0 2px var(--line); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; }
  .kp { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; } .kp button { width:52px; height:50px; border-radius:12px; background:#eef1f8; font-size:22px; font-weight:800; color:var(--ink); }
  .kp button.wide { width:auto; padding:0 14px; font-size:17px; }
  .go { background:var(--wb); color:#fff; font-size:22px; font-weight:800; padding:14px 28px; border-radius:16px; min-height:58px; }
  .go.red { background:var(--mm); } .go.gray { background:#8a93a6; } .go:disabled { opacity:.5; }
  .actions { display:flex; gap:12px; justify-content:flex-end; margin-top:10px; flex-wrap:wrap; }
  .rline { display:flex; gap:14px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--line); font-size:19px; }
  .mark { font-size:30px; font-weight:900; min-width:40px; text-align:center; } .mark.o { color:var(--ok); } .mark.x { color:var(--bad); } .mark.w { color:#8a5a00; }
  .fb { background:#f4f6fb; border-radius:12px; padding:10px 14px; margin-top:8px; font-size:18px; line-height:1.45; }
  .big { font-size:30px; font-weight:900; margin:0 0 6px; }
  .seg { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .nlabel { font-size:19px; font-weight:800; margin:16px 0 8px; } .nlabel:first-child { margin-top:0; }
  .saved { font-size:15px; color:var(--sub); text-align:right; min-height:20px; }
  @media (max-width: 1100px) { .qgrid { grid-template-columns:repeat(2, 1fr); } .split { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- 로그인 -->
<section id="vLogin" class="hidden">
  <div class="hero">
    <h1>CUBIC CITY</h1>
    <p>직육면체의 도시에 온 것을 환영해요!</p>
    <div class="cubes">🧊📦🎲</div>
  </div>
  <div class="panel">
    <!-- 1) 학급 정보 없음 -->
    <div id="stepNoClass" class="hidden" style="text-align:center">
      <h2>학급 QR을 찍어 주세요</h2>
      <p class="hint">선생님이 보여 주는 QR 코드나<br>로그인 카드의 QR 코드를 태블릿 카메라로 찍으면 들어올 수 있어요.</p>
    </div>
    <!-- 2) 번호 고르기 -->
    <div id="stepNum" class="hidden" style="text-align:center">
      <h2>내 번호를 눌러요</h2>
      <p class="hint" id="className"></p>
      <div class="nums" id="nums"></div>
    </div>
    <!-- 3) PIN -->
    <div id="stepPin" class="hidden" style="display:flex;flex-direction:column;align-items:center">
      <p class="bigNo" id="pinNo"></p>
      <p class="hint">로그인 카드의 PIN 4자리를 눌러요</p>
      <div class="pinBox" id="pinBox"><span></span><span></span><span></span><span></span></div>
      <div class="pad" id="pad"></div>
      <div class="err" id="err"></div>
      <button class="back" id="btnBack">번호 다시 고르기</button>
    </div>
  </div>
</section>

<!-- 홈 -->
<section id="vHome" class="hidden">
  <div class="bar">
    <span class="logo">CUBIC CITY</span><button class="homeBtn" data-go="home">🏠 홈</button><span class="grow"></span>
    <span class="me" id="meLabel"></span>
    <button id="btnLogout">나가기</button>
  </div>
  <div class="homeWrap" id="pHome">
    <p class="hello" id="hello"></p>
    <div class="today">
      <h3>오늘의 과제</h3>
      <div id="todayBody"><div class="t">불러오는 중…</div></div>
    </div>
    <div class="menus">
      <button class="menu m1" data-menu="STORY ROOM"><span class="soon">곧 열려요</span><span class="ic">📖</span><span><span class="nm">STORY ROOM</span><div class="ds">이야기로 개념 배우기</div></span></button>
      <button class="menu m2" data-menu="3D LAB"><span class="soon">곧 열려요</span><span class="ic">🧊</span><span><span class="nm">3D LAB</span><div class="ds">직육면체 돌려 보기</div></span></button>
      <button class="menu m3" data-menu="MATH WORKBOOK"><span class="soon">곧 열려요</span><span class="ic">✏️</span><span><span class="nm">MATH WORKBOOK</span><div class="ds">수학익힘 풀고 확인하기</div></span></button>
      <button class="menu m4" data-menu="MY MISTAKES"><span class="soon">곧 열려요</span><span class="ic">📒</span><span><span class="nm">MY MISTAKES</span><div class="ds">오답노트·다시 도전</div></span></button>
    </div>
  </div>
  <!-- MATH WORKBOOK: 문항 목록 -->
  <div class="homeWrap hidden" id="pWb">
    <div class="crumb"><button data-go="home">← 홈</button><span>✏️ MATH WORKBOOK</span></div>
    <div id="wbBody"></div>
  </div>
  <!-- 문항 풀이 -->
  <div class="homeWrap hidden" id="pQ">
    <div class="crumb"><button data-go="wb">← 문제 목록</button><span id="qTitle"></span></div>
    <div class="split">
      <div class="pc"><p class="qtext" id="qText"></p><div id="qFig"></div></div>
      <div class="pc"><div id="qParts"></div><div class="actions"><button class="go" id="btnSubmit">제출하기 ▶</button></div></div>
    </div>
  </div>
  <!-- 채점 결과 -->
  <div class="homeWrap hidden" id="pRes">
    <div class="crumb"><button data-go="wb">← 문제 목록</button><span id="resTitle"></span></div>
    <div class="pc" id="resBody"></div>
  </div>
  <!-- MY MISTAKES: 목록 -->
  <div class="homeWrap hidden" id="pNotes">
    <div class="crumb"><button data-go="home">← 홈</button><span>📒 MY MISTAKES</span></div>
    <div id="notesBody"></div>
  </div>
  <!-- 오답노트 작성 -->
  <div class="homeWrap hidden" id="pNote">
    <div class="crumb"><button data-go="notes">← 오답노트 목록</button><span id="noteTitle"></span></div>
    <div class="split">
      <div class="pc" id="noteLeft"></div>
      <div class="pc" id="noteRight"></div>
    </div>
  </div>
</section>

<!-- 안내(교사 계정·정지 등) -->
<section id="vNotice" class="hidden"><div class="notice"><h2 id="noticeTitle"></h2><p id="noticeBody" class="hint"></p><button id="noticeBtn">나가기</button></div></section>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 학생 데이터 보호를 위해 Analytics는 쓰지 않습니다. 이 파일에는 정답·채점 기준이 없습니다.
const firebaseConfig = {
  apiKey: "AIzaSyAMIHxN7imMkZhjX5SEzQ5zwK0DYGw74Ec",
  authDomain: "mathdata-e79ba.firebaseapp.com",
  projectId: "mathdata-e79ba",
  storageBucket: "mathdata-e79ba.firebasestorage.app",
  messagingSenderId: "561209857926",
  appId: "1:561209857926:web:b7125a64aefc1c782c7e07"
};
const EMAIL_DOMAIN = "mathdata-e79ba.firebaseapp.com";
const DEFAULT_RANGES = "1-14,31-40";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(() => {});

const $ = (s) => document.querySelector(s);
const sid = (n) => "s" + String(n).padStart(2, "0");
const show = (id) => ["#vLogin", "#vHome", "#vNotice"].forEach(v => $(v).classList.toggle("hidden", v !== id));
const step = (id) => ["#stepNoClass", "#stepNum", "#stepPin"].forEach(v => $(v).classList.toggle("hidden", v !== id));
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); };
function parseRanges(r) {
  const out = [];
  String(r || "").split(",").forEach(p => { const m = p.trim().match(/^(\d+)(?:-(\d+))?$/); if (m) { const a = +m[1], b = +(m[2] || m[1]); for (let i = a; i <= b; i++) out.push(i); } });
  return out.length ? out : parseRanges(DEFAULT_RANGES);
}

// ── 학급 정보: QR 주소(?c=학급ID&k=코드&r=번호범위&n=번호) → 기기에 기억 ──
const qp = new URLSearchParams(location.search);
if (qp.get("c") && qp.get("k")) {
  localStorage.setItem("cc.class", JSON.stringify({ c: qp.get("c"), k: qp.get("k"), r: qp.get("r") || DEFAULT_RANGES }));
}
const presetNo = qp.get("n") ? +qp.get("n") : null;
if (qp.toString()) history.replaceState(null, "", location.pathname);   // 주소창에서 코드 숨김
const cls = JSON.parse(localStorage.getItem("cc.class") || "null");

// ── 로그인 화면 ────────────────────────────────────────
let chosenNo = null, pin = "", busy = false;
function renderNums() {
  const box = $("#nums"); box.innerHTML = "";
  parseRanges(cls.r).forEach(n => { const b = document.createElement("button"); b.textContent = n; b.onclick = () => choose(n); box.appendChild(b); });
  const parts = cls.c.split("-"); $("#className").textContent = parts.length === 3 ? `${parts[1]}학년 ${parts[2]}반` : "";
}
function choose(n) { chosenNo = n; pin = ""; $("#pinNo").textContent = `${n}번`; $("#err").textContent = ""; drawPin(); step("#stepPin"); }
function drawPin() { [...$("#pinBox").children].forEach((s, i) => { s.textContent = i < pin.length ? "●" : ""; s.classList.toggle("f", i === pin.length); }); }
(function buildPad() {
  const keys = ["1","2","3","4","5","6","7","8","9","지우기","0","처음"];
  keys.forEach(k => {
    const b = document.createElement("button"); b.textContent = k; if (k.length > 1) b.className = "sub";
    b.onclick = () => {
      if (busy) return;
      if (k === "지우기") pin = pin.slice(0, -1); else if (k === "처음") pin = ""; else if (pin.length < 4) pin += k;
      $("#err").textContent = ""; drawPin(); if (pin.length === 4) login();
    };
    $("#pad").appendChild(b);
  });
})();
$("#btnBack").onclick = () => { pin = ""; step("#stepNum"); };

async function login() {
  busy = true; $("#err").textContent = "확인하는 중…"; $("#err").style.color = "var(--sub)";
  try {
    const email = `${sid(chosenNo)}.c-${cls.c}@${EMAIL_DOMAIN}`.toLowerCase();
    await signInWithEmailAndPassword(auth, email, `mc-${cls.k}-${pin}`);
  } catch (e) {
    $("#err").style.color = "var(--bad)";
    const msg = {
      "auth/invalid-credential": "번호나 PIN을 다시 확인해요.",
      "auth/wrong-password": "번호나 PIN을 다시 확인해요.",
      "auth/user-not-found": "번호나 PIN을 다시 확인해요.",
      "auth/too-many-requests": "여러 번 틀렸어요. 잠시 후 다시 해 보세요. 계속 안 되면 선생님께!",
      "auth/network-request-failed": "인터넷 연결을 확인해 주세요.",
      "auth/user-disabled": "이 계정은 지금 쓸 수 없어요. 선생님께 말씀드려요."
    }[e.code] || "로그인하지 못했어요. (" + e.code + ")";
    $("#err").textContent = msg; pin = ""; drawPin();
  } finally { busy = false; }
}

// ── 로그인 상태에 따라 화면 전환 ─────────────────────────
onAuthStateChanged(auth, async (u) => {
  if (!u) {
    show("#vLogin");
    if (!cls) step("#stepNoClass");
    else { renderNums(); if (presetNo && parseRanges(cls.r).includes(presetNo)) choose(presetNo); else step("#stepNum"); }
    return;
  }
  try {
    const p = await getDoc(doc(db, "users", u.uid));
    if (!p.exists() || p.data().role !== "student") return notice("교사 계정으로 로그인되어 있어요", "학생 화면을 보려면 나가기를 누른 뒤 학생 번호로 들어와요. 교사 화면은 teacher.html에서 열 수 있어요.");
    const prof = p.data();
    if (!prof.active) return notice("지금은 들어갈 수 없어요", "선생님께 말씀드려요.");
    await openHome(prof);
  } catch (e) {
    notice("정보를 불러오지 못했어요", "인터넷 연결을 확인하고 다시 들어와요. (" + (e.code || e.message) + ")");
  }
});
function notice(t, b) { $("#noticeTitle").textContent = t; $("#noticeBody").textContent = b; show("#vNotice"); }
$("#noticeBtn").onclick = () => signOut(auth);

// ── 문항 상태 ─────────────────────────────────────────
function qState(qid) {
  const mine = subs.filter(s => s.questionId === qid && (!asg || s.assignmentId === asg.id)).sort((a, b) => msOf(a.submittedAt) - msOf(b.submittedAt));
  const done = mine.filter(s => ["graded", "pending_review"].includes(s.status));
  const pending = mine.find(s => ["submitted", "grading"].includes(s.status)) || null;
  const max = asg?.policy?.maxAttempts || 3;
  const note = notes[qid] || null;
  const st = { mine, done, pending, max, note, attempts: done.length, last: mine[mine.length - 1] || null,
    solved: done.some(s => s.allCorrect), review: done.some(s => s.status === "pending_review") && !done.some(s => s.allCorrect) };
  if (pending) Object.assign(st, { label: "채점 중", cls: "b-wait", action: "result" });
  else if (st.solved) Object.assign(st, { label: "맞았어요 ○", cls: "b-ok", action: "result" });
  else if (st.review) Object.assign(st, { label: "선생님 확인 중", cls: "b-wait", action: "result" });
  else if (st.attempts === 0) Object.assign(st, { label: "풀어 보기", cls: "b-new", action: "solve" });
  else if (st.attempts >= max) Object.assign(st, { label: "기회를 다 썼어요", cls: "b-bad", action: "result" });
  else if (!note || !["submitted", "resolved"].includes(note.status)) Object.assign(st, { label: "오답노트를 먼저 써요", cls: "b-bad", action: "note" });
  else Object.assign(st, { label: `다시 도전 (${st.attempts}/${max})`, cls: "b-bad", action: "solve" });
  return st;
}

let cur = null;   // { qid, ans, startedAt }
function openQ(qid) {
  const q = questions[qid]; if (!q) return toast("문제를 불러오는 중이에요");

  const box = $("#qParts"); box.innerHTML = "";
  (q.parts || []).forEach(p => box.appendChild(partUI(p, cur.ans)));

}
function partUI(p, ans) {
  const w = document.createElement("div"); w.className = "part";
  w.innerHTML = `<div class="pp">${(q => q.length > 1 ? `(${p.partId}) ` : "")(questions[cur.qid].parts)}${esc(p.prompt)}</div>`;
  const opts = p.publicOptions || [];
  const mark = /△표/.test(p.prompt) ? "△ " : /○표/.test(p.prompt) ? "○ " : "";
  if (p.inputType === "single_choice" || p.inputType === "ox") {
    const c = document.createElement("div"); c.className = "chips";
    opts.forEach(o => { const b = document.createElement("button"); b.className = "chip"; b.textContent = o;
      b.onclick = () => { ans[p.partId] = o; c.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); }; c.appendChild(b); });
    w.appendChild(c);
  } else if (p.inputType === "multi_select") {
    ans[p.partId] = [];
    const c = document.createElement("div"); c.className = "chips";
    opts.forEach(o => { const b = document.createElement("button"); b.className = "chip"; b.textContent = o;
      b.onclick = () => { const a = ans[p.partId]; const i = a.indexOf(o); if (i >= 0) a.splice(i, 1); else a.push(o);
        b.classList.toggle("on", i < 0); b.textContent = (i < 0 ? mark || "✓ " : "") + o; }; c.appendChild(b); });
    w.appendChild(c);
  } else if (p.inputType === "face_name") {
    let letters = "";
    const f = document.createElement("div"); f.className = "face"; f.innerHTML = `<span>면</span>` + "<span class='bx'></span>".repeat(4);
    const draw = () => { [...f.querySelectorAll(".bx")].forEach((x, i) => x.textContent = letters[i] || ""); ans[p.partId] = letters ? "면 " + letters : ""; };
    const kp = document.createElement("div"); kp.className = "kp";
    [..."ㄱㄴㄷㄹㅁㅂㅅㅇ"].forEach(ch => { const b = document.createElement("button"); b.textContent = ch; b.onclick = () => { if (letters.length < 4) { letters += ch; draw(); } }; kp.appendChild(b); });
    const del = document.createElement("button"); del.className = "wide"; del.textContent = "⌫ 지우기"; del.onclick = () => { letters = letters.slice(0, -1); draw(); }; kp.appendChild(del);
    w.appendChild(f); w.appendChild(kp);
    const tip = document.createElement("div"); tip.className = "alt"; tip.textContent = "꼭짓점을 둘레를 따라 차례대로 눌러요."; w.appendChild(tip);
  } else if (p.inputType === "number") {
    const r = document.createElement("div"); r.className = "numrow";
    r.innerHTML = `<input class="tx" inputmode="decimal" autocomplete="off"><span class="unit">${esc(p.unit || "")}</span>`;
    r.querySelector("input").oninput = (e) => ans[p.partId] = e.target.value.trim();
    w.appendChild(r);
  } else {
    const i = document.createElement("input"); i.className = "tx"; i.autocomplete = "off"; i.oninput = () => ans[p.partId] = i.value; w.appendChild(i);
  }
  return w;
}
$("#btnSubmit").onclick = async () => {
  const q = questions[cur.qid]; const s = qState(cur.qid);
  if (s.pending) return toast("채점 중인 답이 있어요. 잠시 기다려요.");
  const empty = (q.parts || []).filter(p => { const v = cur.ans[p.partId]; return v === undefined || v === "" || (Array.isArray(v) && !v.length); });
  if (empty.length && !confirm("아직 비어 있는 칸이 있어요. 그래도 낼까요?")) return;
  $("#btnSubmit").disabled = true;
  const subId = uuid();
  const raw = {}; (q.parts || []).forEach(p => raw[p.partId] = cur.ans[p.partId] ?? (p.inputType === "multi_select" ? [] : ""));
  const data = { studentId: prof.studentId, assignmentId: asg.id, questionId: cur.qid, lessonId: q.lesson || null,
    attemptNo: s.attempts + 1, isRetry: s.attempts > 0, rawAnswers: raw, startedAt: cur.startedAt,
    durationMs: Date.now() - cur.startedAt, status: "submitted", clientVersion: "wb-1" };
  pendingSave(subId, data);
  openResult(subId, cur.qid);
  sendSubmission(subId, data);
};
// 제출: 기기에 먼저 보관 → Firestore 전송(끊기면 다음 접속 때 다시 전송)
function pendingAll() { try { return JSON.parse(localStorage.getItem("cc.pending") || "{}"); } catch (_) { return {}; } }
function pendingSave(id, d) { const a = pendingAll(); a[id] = d; localStorage.setItem("cc.pending", JSON.stringify(a)); }
function pendingDrop(id) { const a = pendingAll(); delete a[id]; localStorage.setItem("cc.pending", JSON.stringify(a)); }
async function sendSubmission(id, data) {
  try { await setDoc(doc(db, "classes", prof.classId, "submissions", id), { ...data, submittedAt: serverTimestamp() }); pendingDrop(id); }
  catch (e) {
    if (e.code === "permission-denied") { pendingDrop(id); if (subs.some(s => s.id === id)) return; toast("제출하지 못했어요. 선생님께 알려 주세요."); }
    else toast("연결이 끊겼어요. 답은 기기에 보관했다가 다시 보낼게요.");
  }
}
function resendPending() {
  const a = pendingAll();
  Object.entries(a).forEach(([id, d]) => {
    if (subs.some(s => s.id === id) || d.studentId !== prof.studentId) return pendingDrop(id);
    sendSubmission(id, d);
  });
}

let resTimer = null;
function openResult(subId, qid) { view = { page: "res", subId, qid, openedAt: Date.now() }; page("pRes"); renderResult(); clearInterval(resTimer); resTimer = setInterval(() => view.page === "res" ? renderResult() : clearInterval(resTimer), 4000); }
function renderResult() {
  const { subId, qid, openedAt } = view; const q = questions[qid]; const s = subs.find(x => x.id === subId);
  $("#resTitle").textContent = qLabel(q);
  const waitLong = Date.now() - (s?.submittedAt?.toMillis?.() || openedAt) > 10000;
  if (!s || ["submitted", "grading"].includes(s.status)) {
    $("#resBody").innerHTML = `<p class="big">⏳ ${!s ? "답을 보내는 중…" : "채점 중…"}</p>
      <p class="hint">${waitLong ? "선생님 화면이 켜지면 채점돼요. 답은 안전하게 저장되어 있어요. 다음 문제를 풀어도 돼요!" : "잠깐만 기다려요."}</p>
      <div class="actions"><button class="go gray" data-act="wb">문제 목록</button></div>`;
  } else if (s.status === "rejected") {
    $("#resBody").innerHTML = `<p class="big">🙋 ${esc(s.feedback?.[0]?.text || "제출이 처리되지 않았어요.")}</p>
      <div class="actions">${s.rejectReason === "note_required" ? `<button class="go red" data-act="note">오답노트 쓰기</button>` : ""}<button class="go gray" data-act="wb">문제 목록</button></div>`;
  } else {
    const pr = s.partResults || {}; const st = qState(qid);
    const lines = (q.parts || []).map(p => { const r = pr[p.partId] || {};
      const m = r.correct === true ? ["o", "○"] : r.correct === false ? ["x", "×"] : ["w", "⏳"];
      return `<div class="rline"><span class="mark ${m[0]}">${m[1]}</span><div style="flex:1"><div><b>${(q.parts.length > 1 ? `(${p.partId}) ` : "")}</b>${esc(p.prompt)}</div>
        <div class="hint" style="margin:4px 0 0">내 답: <b>${esc(fmtAns(s.rawAnswers?.[p.partId]))}</b>${p.unit && s.rawAnswers?.[p.partId] ? " " + esc(p.unit) : ""}</div>
        ${r.feedback ? `<div class="fb">💬 ${esc(r.feedback)}</div>` : ""}</div></div>`; }).join("");
    const head = s.allCorrect ? `🎉 모두 맞았어요! (${s.score}/${s.maxScore})` : s.status === "pending_review" ? `⏳ 선생님이 확인하고 있어요 (${s.score}/${s.maxScore})` : `${s.score}/${s.maxScore} – 틀린 부분을 다시 생각해 봐요`;
    const btns = s.allCorrect ? `<button class="go" data-act="next">다음 문제 ▶</button>`
      : (st.note && !["submitted", "resolved"].includes(st.note.status) && st.attempts < st.max) ? `<button class="go red" data-act="note">오답노트 쓰러 가기 ▶</button>`
      : (st.attempts >= st.max && !st.solved) ? `<span class="hint">이 문제는 기회를 다 썼어요. 오답노트를 정리해 두면 선생님이 봐 주세요.</span>` : "";
    $("#resBody").innerHTML = `<p class="big">${head}</p>${lines}<div class="actions">${btns}<button class="go gray" data-act="wb">문제 목록</button></div>`;
  }
  $("#resBody").querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    if (b.dataset.act === "wb") go("wb");
    if (b.dataset.act === "note") openNote(qid);
    if (b.dataset.act === "next") { const ids = asg?.questionIds || []; const nx = ids.find(id => !qState(id).solved && qState(id).action === "solve"); nx ? openQ(nx) : go("wb"); }
  });
}

const NOTE_ST = { auto_created: ["써야 해요", "b-bad"], writing: ["써야 해요", "b-bad"], submitted: ["제출함 · 다시 도전할 수 있어요", "b-wait"], resolved: ["해결! 🎉", "b-ok"], revisit_requested: ["선생님이 다시 생각해 보래요", "b-bad"] };
function renderNotes() {
  const list = Object.values(notes).sort((a, b) => (a.status === "resolved") - (b.status === "resolved") || (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));
  if (!list.length) { $("#notesBody").innerHTML = `<div class="pc"><p class="big">📒 아직 오답노트가 없어요</p><p class="hint">수학익힘에서 틀린 문제가 생기면 여기에 자동으로 만들어져요.</p></div>`; return; }
  $("#notesBody").innerHTML = `<div class="qgrid">${list.map(n => { const q = questions[n.questionId]; const [lb, c] = NOTE_ST[n.status] || [n.status, "b-new"];
    return `<button class="qcard" data-n="${n.questionId}"><span class="tt">${esc(qLabel(q))}</span><span class="dd">틀린 횟수 ${(n.attemptHistory || []).filter(h => !h.allCorrect).length}번</span><span class="badge ${c}">${lb}</span></button>`; }).join("")}</div>`;
  $("#notesBody").querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    const n = notes[b.dataset.n]; if (n.status === "submitted") { const s = qState(n.questionId); if (s.action === "solve" && asg && n.assignmentId === asg.id) return openQ(n.questionId); }
    openNote(b.dataset.n);
  });
}

// ── 오답노트 작성 ──────────────────────────────────────
let nt = null, ntTimer = null;   // { qid, data, dirty }
function noteDraftKey(qid) { return `cc.note.${prof.studentId}.${qid}`; }
function openNote(qid) {
  const n = notes[qid]; if (!n) return toast("오답노트를 만드는 중이에요. 잠시 후 다시 눌러요.");
  const q = questions[qid];
  const editable = ["auto_created", "writing", "revisit_requested"].includes(n.status);
  let draft = {}; try { draft = JSON.parse(localStorage.getItem(noteDraftKey(qid)) || "{}"); } catch (_) {}
  const base = { errorReasonType: n.errorReasonType || "", errorReasonText: n.errorReasonText || "", missedConcepts: (n.missedConcepts && n.missedConcepts.length) ? n.missedConcepts : (n.autoMisconceptionTags || []).filter(t => CONCEPTS[t]),
    correctMethodText: n.correctMethodText || "", nextTimeTip: n.nextTimeTip || "" };
  nt = { qid, data: editable ? { ...base, ...draft } : base, dirty: false, editable };
  view = { page: "note", qid }; page("pNote");
  $("#noteTitle").textContent = `${qLabel(q)} 오답노트`;
  const last = subs.filter(s => s.questionId === qid && ["graded", "pending_review"].includes(s.status)).sort((a, b) => msOf(a.submittedAt) - msOf(b.submittedAt)).pop();
  $("#noteLeft").innerHTML = `<div class="nlabel">문제</div><p class="qtext" style="font-size:19px">${esc(q?.questionText)}</p>
    ${q?.imageData ? `<img class="qimg" src="${q.imageData}" alt="">` : ""}
    <div class="nlabel">처음 낸 답</div>${(q?.parts || []).map(p => `<div class="hint" style="margin:2px 0">${q.parts.length > 1 ? `(${p.partId}) ` : ""}${esc(fmtAns(n.firstAnswer?.[p.partId]))}</div>`).join("")}
    ${last?.feedback?.length ? `<div class="nlabel">채점 피드백</div>${last.feedback.map(f => `<div class="fb">💬 ${esc(f.text)}</div>`).join("")}` : ""}
    ${n.revisitReason ? `<div class="nlabel">선생님 말씀</div><div class="fb">🧑‍🏫 ${esc(n.revisitReason)}</div>` : ""}`;
  const d = nt.data, dis = editable ? "" : "disabled";
  $("#noteRight").innerHTML = `
    <div class="nlabel">① 왜 틀렸다고 생각하나요?</div>
    <div class="seg" id="nReason">${REASONS.map(([k, v]) => `<button class="chip ${d.errorReasonType === k ? "on" : ""}" data-r="${k}" ${dis}>${v}</button>`).join("")}</div>
    <input class="tx" id="nReasonText" placeholder="더 자세히 써도 좋아요" value="${esc(d.errorReasonText)}" ${dis}>
    <div class="nlabel">② 어떤 개념을 놓쳤나요?</div>
    <div class="seg" id="nConcepts">${Object.entries(CONCEPTS).map(([k, v]) => `<button class="chip ${d.missedConcepts.includes(k) ? "on" : ""}" data-c="${k}" ${dis} style="font-size:16px;text-align:left">${v}</button>`).join("")}</div>
    <div class="nlabel">③ 올바른 해결 방법은? <span class="hint" style="font-size:15px">(손글씨는 다음 업데이트에서 열려요)</span></div>
    <textarea class="tx" id="nMethod" placeholder="어떻게 풀어야 맞을지 차례대로 써 봐요" ${dis}>${esc(d.correctMethodText)}</textarea>
    <div class="nlabel">④ 다음에는 무엇을 주의할까요?</div>
    <input class="tx" id="nTip" placeholder="예: 색칠한 면과 만나지 않는 면을 찾기" value="${esc(d.nextTimeTip)}" ${dis}>
    <div class="saved" id="nSaved">${editable ? "" : (NOTE_ST[n.status] || [""])[0]}</div>
    <div class="actions">${editable ? `<button class="go gray" id="nSave">임시 저장</button><button class="go red" id="nSubmit">제출하고 다시 도전 ▶</button>`
      : (n.status === "submitted" && qState(qid).action === "solve" && asg && n.assignmentId === asg.id) ? `<button class="go" id="nRetry">다시 도전 ▶</button>` : ""}</div>`;
  if (!editable) { const r = $("#nRetry"); if (r) r.onclick = () => openQ(qid); return; }
  const touch = () => { nt.dirty = true; localStorage.setItem(noteDraftKey(qid), JSON.stringify(nt.data)); $("#nSaved").textContent = "기기에 저장됨"; };
  $("#nReason").querySelectorAll("[data-r]").forEach(b => b.onclick = () => { d.errorReasonType = b.dataset.r; $("#nReason").querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); touch(); });
  $("#nConcepts").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { const k = b.dataset.c, i = d.missedConcepts.indexOf(k); if (i >= 0) d.missedConcepts.splice(i, 1); else d.missedConcepts.push(k); b.classList.toggle("on", i < 0); touch(); });
  [["#nReasonText", "errorReasonText"], ["#nMethod", "correctMethodText"], ["#nTip", "nextTimeTip"]].forEach(([sel, f]) => {
    $(sel).oninput = (e) => { d[f] = e.target.value; touch(); };
    $(sel).onblur = () => saveNote(false);
  });
  $("#nSave").onclick = () => saveNote(true);
  $("#nSubmit").onclick = () => submitNote();
  clearInterval(ntTimer); ntTimer = setInterval(() => { if (view.page === "note") saveNote(false); else clearInterval(ntTimer); }, 30000);
}
function renderNoteStatusOnly() {   // 다른 기기·채점 엔진이 노트를 바꾸면 화면을 다시 그림(작성 중이 아닐 때만)
  const n = notes[view.qid]; if (n && nt && !nt.dirty && !["auto_created", "writing", "revisit_requested"].includes(n.status) !== !nt.editable) openNote(view.qid);
}
async function saveNote(force) {
  if (!nt || !nt.editable || (!nt.dirty && !force)) return;
  const d = nt.data;
  try {
    await updateDoc(doc(db, "classes", prof.classId, "wrongNotes", notes[nt.qid].id), {
      errorReasonType: d.errorReasonType, errorReasonText: d.errorReasonText, missedConcepts: d.missedConcepts,
      correctMethodText: d.correctMethodText, nextTimeTip: d.nextTimeTip, status: "writing", updatedAt: serverTimestamp() });
    nt.dirty = false; $("#nSaved").textContent = "저장됨 ✓";
  } catch (e) { $("#nSaved").textContent = "기기에 보관 중(연결 확인)"; }
}
async function submitNote() {
  const d = nt.data;
  if (!d.errorReasonType) return toast("① 왜 틀렸는지 골라 주세요");
  if (!d.correctMethodText.trim()) return toast("③ 올바른 해결 방법을 써 주세요");
  $("#nSubmit").disabled = true;
  try {
    await updateDoc(doc(db, "classes", prof.classId, "wrongNotes", notes[nt.qid].id), {
      errorReasonType: d.errorReasonType, errorReasonText: d.errorReasonText, missedConcepts: d.missedConcepts,
      correctMethodText: d.correctMethodText, nextTimeTip: d.nextTimeTip, status: "submitted", updatedAt: serverTimestamp() });
    localStorage.removeItem(noteDraftKey(nt.qid)); nt.dirty = false;
    toast("오답노트를 제출했어요! 다시 도전해요 💪");
    const qid = nt.qid; notes[qid] = { ...notes[qid], status: "submitted" };
    const s = qState(qid);
    if (s.action === "solve" && asg && notes[qid].assignmentId === asg.id) openQ(qid); else go("notes");
  } catch (e) { $("#nSubmit").disabled = false; toast("제출하지 못했어요 (" + e.code + ")"); }
}
</script>
</body>
</html>
